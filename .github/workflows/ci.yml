name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://cms.cancagua.cl
      WEBPAY_API_KEY: 00000000-0000-4000-8000-000000000000
      WEBPAY_COMMERCE_CODE: "0"
      WEBPAY_ENVIRONMENT: production
      CLOUDINARY_URL: cloudinary://ci:ci@example.invalid
      JWT_SECRET: ci-only-not-a-production-secret
      RESEND_API_KEY: re_ci_only_not_a_real_key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        # These legacy suites call live database/payment integrations and need
        # their own integration-test environment before they can run safely in CI.
        run: >-
          pnpm exec vitest run
          --exclude server/concierge.test.ts
          --exclude server/permissions.test.ts
          --exclude server/subscriber-count.test.ts
