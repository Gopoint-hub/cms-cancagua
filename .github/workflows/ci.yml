name: CMS CI

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-tests:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    env:
      APP_URL: https://cms.cancagua.cl
      WEBPAY_API_KEY: 00000000-0000-0000-0000-000000000000
      WEBPAY_COMMERCE_CODE: "123456789"
      WEBPAY_ENVIRONMENT: production
      CLOUDINARY_URL: cloudinary://ci_key:ci_secret@ci_cloud
      RESEND_API_KEY: re_ci_test_key
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test -- --run
